# checks to run on branches for each pull request
name: branch-checks

on:
  pull_request:

jobs:
  pre-commit:
    name: Run all pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install uv
      - uses: pre-commit/action@v3.0.1

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Run unit tests
        run: |
          pip install -r misc/requirements_development.txt
          pip install -r shared/requirements_shared.txt
          pip install -r airflow_src/requirements_airflow.txt
          pip install -r airflow_src/requirements_docker_job_engine.txt
          pip install -r webapp/requirements_webapp.txt
          airflow db migrate
          pip freeze
          python -m pytest shared webapp airflow_src

  docker-compose-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: |
          echo -e "AIRFLOW_UID=$(id -u)" > envs/.env-airflow
      - uses: hoverkraft-tech/compose-action@v2.0.0
        with:
          compose-file: "docker-compose.yaml"
          compose-flags: "--env-file=envs/.env-airflow --env-file=envs/local.env --profile local"
