# checks to run on branches for each pull request
name: branch-checks

on:
  pull_request:

jobs:
  pre-commit:
    name: Run all pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install uv
      - uses: pre-commit/action@v3.0.1

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Run shared unit tests
        run: |
          pip install -r misc/requirements_development.txt
          pip install -r shared/requirements_shared.txt
          pip freeze
          python -m pytest shared

      # separate venvs: streamlit requires pandas<3, the airflow 3.3.1 constraints pin pandas 3.0.5
      - name: Run webapp unit tests
        run: |
          python -m venv .venv-webapp
          .venv-webapp/bin/pip install -r misc/requirements_development.txt
          .venv-webapp/bin/pip install -r shared/requirements_shared.txt
          .venv-webapp/bin/pip install -r webapp/requirements_webapp.txt
          .venv-webapp/bin/pip freeze
          .venv-webapp/bin/python -m pytest webapp

      - name: Run Airflow unit tests
        run: |
          python -m venv .venv-airflow
          .venv-airflow/bin/pip install -r misc/requirements_development.txt
          .venv-airflow/bin/pip install -r shared/requirements_shared.txt
          .venv-airflow/bin/pip install apache-airflow==3.3.1 --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.11.txt"
          .venv-airflow/bin/airflow db migrate
          .venv-airflow/bin/pip install -r airflow_src/requirements_airflow.txt
          .venv-airflow/bin/pip install -r airflow_src/requirements_docker_engine.txt
          .venv-airflow/bin/pip freeze
          .venv-airflow/bin/python -m pytest airflow_src

  docker-compose-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: |
          echo -e "AIRFLOW_UID=$(id -u)" > envs/.env-airflow
      - uses: hoverkraft-tech/compose-action@v2.0.0
        with:
          compose-file: "docker-compose.yaml"
          compose-flags: "--env-file=envs/.env-airflow --env-file=envs/local.env --profile local"
