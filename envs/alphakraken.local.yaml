# Configuration file for alphakraken: instruments and mounts (environment: local)
instruments:
  test1:
    type: thermo # Needs to match one of the values defined in common.keys.InstrumentTypes (thermo, bruker, sciex).
    # the following is required for mounting only (read by mount.sh):
    username: user
    mount_src: //0.0.0.0/test1/
    mount_target: instruments/test1 # DO NOT CHANGE THE 'instruments' part -> path_views.Locations.INSTRUMENTS
    # skip_processing: true  # optional, default: false
    # skip_quanting: true  # optional, default: false
    # min_free_space_gb: 100  # optional, default: taken from Airflow variable MIN_FREE_SPACE_GB. Set to -1 to exclude from file removing.
    # min_file_age_days: 14  # optional, default: taken from Airflow variable MIN_FILE_AGE_TO_REMOVE_IN_DAYS
    # file_move_delay_m: 60  # optional, default: 15. Set to -1 to disable file moving.
  test2:
    type: bruker
  test3:
    type: sciex

locations:
  general:
    mounts_path: /home/kraken-user/alphakraken/mounts
  # e.g.:
  #  xxx:
  #    username: user  # username for mounting
  #    mount_src: //mount_src/xxx  # source path for mounting ("worker pc view" part 1)
  #    mount_target: xxx # DO NOT CHANGE! this is related to the file structure within the containers -> cf. path_views.Locations ("worker pc view" part 2)
  #    absolute_path: /fs/pool/pool-0/alphakraken_sandbox/xxx  # this is the absolute path of this folder on the shared file system ("cluster view")
  backup:
    username: user
    mount_src: //mount_src/backup
    mount_target: backup # DO NOT CHANGE! relative to mounts_path -> path_views.Locations.BACKUP
    absolute_path: /fs/pool/pool-0/alphakraken_sandbox/backup
  settings:
    # no need for mount information (yet)
    absolute_path: /fs/pool/pool-0/alphakraken_sandbox/settings
  software:
    # location of custom executables for quanting software
    # no need for mount information (yet)
    absolute_path: /fs/home/kraken-read/software
  slurm:
    # location of slurm submit script and destination for slurm logs
    # no need for mount information (yet)
    absolute_path: /fs/pool/pool-0/alphakraken_local/slurm
  output:
    username: user
    mount_src: //mount_src/output
    mount_target: output # DO NOT CHANGE! relative to mounts_path -> path_views.Locations.OUTPUT
    absolute_path: /fs/pool/pool-0/alphakraken_sandbox/output
  logs:
    username: user
    mount_src: //mount_src/airflow_logs
    mount_target: airflow_logs # DO NOT CHANGE! relative to mounts_path ->/opt/airflow/logs

general:
  notifications:
    ops_alerts_webhook_url: "https://hooks.slack.com/services/<something> or https://...api.powerplatform.com:443/powerautomate/automations/<something>"
    business_alerts_webhook_url: "https://hooks.slack.com/services/<something> or https://...api.powerplatform.com:443/powerautomate/automations/<something>"
    slack_bot_token: "xoxb-..." # for individual alerts; get from api.slack.com/apps → your app → OAuth & Permissions → "Bot User OAuth Token" (needs `chat:write` scope)
    webapp_url: "http://localhost:8501"

backup:
  # absolute path of the backup folder on the shared file system
  # Not relevant for the pipeline file operations, but persisted in the DB for the later discovery of raw files by users.
  backup_base_path: /fs/pool/pool-0/alphakraken_sandbox/backup
  backup_type: local # or 's3'
  purging_verification_type: local # 'local', 's3', or 'force_local'
  s3:
    region: eu-central-1
    bucket_prefix: alphakraken
    auto_create_buckets: false

# the places where quanting jobs execute, referenced by name from a settings entry (`runner`)
runners:
  - name: slurm # unique within the list; the order here is the display order in the webapp
    engine: slurm # one of shared.keys.JobEngines
    os: linux # linux | macos | windows, determines the path flavour of `view`
    # prefix of the Airflow connections this runner uses, required for engines that use SSH.
    # Credentials stay in Airflow connections: they are encrypted there, can be rotated without a
    # restart, and only the workers need them. A prefix instead of a list, so head nodes can be
    # added or removed in Airflow alone.
    ssh_connection_id_prefix: cluster_ssh_connection
    # the data directories as seen from this runner, cf. path_views.Locations
    # These depend on how the central file system is mounted on the runner, and are used to resolve the paths for the analysis jobs.
    view:
      # location where the raw file will be read from
      backup: /fs/pool/pool-0/alphakraken_sandbox/backup
      # location where the output files will be written to
      output: /fs/pool/pool-0/alphakraken_sandbox/output
      # location of additional input files for settings, looked up in subfolders '<settings_name>'
      settings: /fs/pool/pool-0/alphakraken_sandbox/settings
      # location of custom executables for quanting software
      software: /fs/home/kraken-read/software
      # location of slurm submit script and destination for slurm logs
      slurm: /fs/pool/pool-0/alphakraken_local/slurm
  - name: docker
    engine: docker
    os: linux
    # no ssh_connection_id_prefix: the docker engine does not use SSH
    view: # paths inside the job container
      backup: /fs/pool/pool-0/alphakraken_sandbox/backup
      output: /fs/pool/pool-0/alphakraken_sandbox/output
      settings: /fs/pool/pool-0/alphakraken_sandbox/settings
      software: /fs/home/kraken-read/software
