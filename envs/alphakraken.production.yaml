# Configuration file for alphakraken: instruments and mounts (environment: production)
# see `alphakraken.local.yaml` for a commented version
instruments:
  test1:
    type: thermo
    username: user
    mount_src: //0.0.0.0/test1/
mounts:
  backup:
    username: kraken-write
    mount_src: //samba-pool-1/pool-1
  output:
    username: kraken-write
    mount_src: //samba-pool-2/pool-2/output
  airflow_logs:
    username: kraken-write
    mount_src: //samba-pool-2/pool-2/airflow_logs

general:
  timezone: UTC # IANA name of the timezone the webapp displays all timestamps in, e.g. 'Europe/Berlin'. Optional, default: UTC.
  notifications:
    # any apprise URL (https://github.com/caronc/apprise#supported-notifications), e.g. a MS Teams Power Automate
    # workflow URL. For Slack, "slacktext://<bot token>/<channel id>" posts full-width messages through the bot
    # (invite it to the channel); apprise's own Slack service (slack://, https://hooks.slack.com/...) posts attachments.
    ops_alerts_url: "slacktext://<slack_bot_token>/<channel id> or https://...api.powerplatform.com:443/powerautomate/automations/<something>"
    business_alerts_url: "slacktext://<slack_bot_token>/<channel id> or https://...api.powerplatform.com:443/powerautomate/automations/<something>"
    # optional, for direct messages to users: apprise URL with {{ALPHAKRAKEN_MESSENGER_ID}} replaced by the messenger id of the user, e.g.
    # "slacktext://xoxb-.../@{{ALPHAKRAKEN_MESSENGER_ID}}" (bot token from api.slack.com/apps → your app → OAuth & Permissions,
    # needs `chat:write` scope; `slack://` instead of `slacktext://` uses apprise's own Slack service)
    user_alerts_url: "slacktext://<slack_bot_token>/@{{ALPHAKRAKEN_MESSENGER_ID}}"
    webapp_url: "<webapp_url>"
    # optional: instruments to alert on if no new file is acquired for a while
    # instrument_stall_instrument_ids: [test1]
    # optional alert thresholds, shown with their defaults
    # free_space_threshold_gb: 200
    # file_system_free_space_thresholds_gb: {backup: 500, output: 300}
    # local_free_space_threshold_gb: 10
    # pump_pressure_threshold_bar: 20
    # pump_pressure_absolute_threshold_bar: 480

display_paths:
  backup: /fs/pool-1/backup
  output: /fs/pool-2/output
  settings: /fs/pool-2/settings
  software: /fs/home/kraken-read/software

backup:
  backup_type: local # or 's3'
  purging_verification_type: local # 'local', 's3', or 'force_local'
  s3:
    region: eu-central-1
    bucket_prefix: alphakraken
    auto_create_buckets: false

runners:
  - name: slurm
    engine: slurm
    os: linux
    ssh_connection_id_prefix: cluster_ssh_connection
    view:
      backup: /fs/pool-1/backup
      output: /fs/pool-2/output
      settings: /fs/pool-2/settings
      software: /fs/home/kraken-read/software
  - name: docker
    engine: docker
    os: linux
    view:
      backup: /fs/pool-1/backup
      output: /fs/pool-2/output
      settings: /fs/pool-2/settings
      software: /fs/home/kraken-read/software
