# Configuration file for alphakraken: instruments and mounts (environment: sandbox)
# see `alphakraken.local.yaml` for a commented version
instruments:
  test1:
    type: thermo
    username: user
    mount_src: //0.0.0.0/test1/
    mount_target: instruments/test1
mounts:
  backup:
    username: kraken-write
    mount_src: //samba-pool-0/pool-0/alphakraken_sandbox/backup
    mount_target: backup
  output:
    username: kraken-write
    mount_src: //samba-pool-0/pool-0/alphakraken_sandbox/output
    mount_target: output
  logs:
    username: kraken-write
    mount_src: //samba-pool-0/pool-0/alphakraken_sandbox/airflow_logs
    mount_target: airflow_logs

general:
  notifications:
    ops_alerts_webhook_url: "https://hooks.slack.com/services/<something> or https://...api.powerplatform.com:443/powerautomate/automations/<something>"
    business_alerts_webhook_url: "https://hooks.slack.com/services/<something> or https://...api.powerplatform.com:443/powerautomate/automations/<something>"
    slack_bot_token: "<slack_bot_token>"
    webapp_url: "<webapp_url>"

backup:
  backup_base_path: /fs/pool-0/alphakraken_sandbox/backup
  backup_type: local # or 's3'
  purging_verification_type: local # 'local', 's3', or 'force_local'
  s3:
    region: eu-central-1
    bucket_prefix: alphakraken
    auto_create_buckets: true

runners:
  - name: slurm
    engine: slurm
    os: linux
    ssh_connection_id_prefix: cluster_ssh_connection
    view:
      backup: /fs/pool-0/alphakraken_sandbox/backup
      output: /fs/pool-0/alphakraken_sandbox/output
      settings: /fs/pool-0/alphakraken_sandbox/settings
      software: /fs/home/kraken-read/software
      slurm: /fs/pool-0/alphakraken_sandbox/slurm
  - name: docker
    engine: docker
    os: linux
    view:
      backup: /fs/pool-0/alphakraken_sandbox/backup
      output: /fs/pool-0/alphakraken_sandbox/output
      settings: /fs/pool-0/alphakraken_sandbox/settings
      software: /fs/home/kraken-read/software
