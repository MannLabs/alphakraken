# Alert suppression configuration
# Suppress specific alerts based on error class, context, and message patterns
#
# Rules:
# - error_class: "*" matches any alert class
# - instrument_id: exact match on the instrument an issue relates to (optional)
# - context: "*" matches any context
# - message: "*" matches any message
# - context is matched exactly against the issue identifier, message as substring

