authors = [
    {name = "Mann Labs", email = "mschwoerer@biochem.mpg.de"}
]
description = "A fully automated data processing and analysis system for mass spectrometry experiments."
readme = "README.md"
license = {file = "LICENSE.txt"}

[tool.ruff.lint]
select =  [ "ALL" ]

ignore = [
    "E501",  # Line too long  (ruff wraps code, but not docstrings)
    "B028",  #  No explicit `stacklevel` keyword argument found (for warnings)
    "COM812", #may cause conflicts when used with the formatter
    "ISC001", #may cause conflicts when used with the formatter
    "D211", # no-blank-line-before-class
    "D213", # multi-line-summary-second-line
    "S101", # Use of `assert` detected
    "INP001", # implicit namespace package.
    "ERA001", # Found commented-out code
    "D203", # 1 blank line required before class docstring
    "TD002", "TD003", "FIX002",  # things around TO-DO
    "PT011", #pytest.raises(ValueError) is too broad
    "G004", "EM102", # Logging statement uses f-string
    "TRY003", # Avoid specifying long messages outside the exception class
    "ANN002", # Missing type annotation for `*args`
    "ANN003", # Missing type annotation for `**kwargs
    "FA102", # Missing `from __future__ import annotations
    "EM101", # Exception must not use a string literal, assign to variable first
    "D104", # Missing docstring in public package
    "ANN204", # Missing return type annotation for special method `__init__`
    "D401", # First line of docstring should be in imperative mood
    "B023", # Function definition does not bind loop variable
    "PD901", # Avoid using the generic variable name `df` for DataFrames"
    "TC003", # Move standard library import into a type-checking block
    "ANN401", #  Dynamically typed expressions (typing.Any) are disallowed
    "LOG015", # root-logger-call
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mongoengine".msg = "use shared.db"
"pymongo".msg = "use shared.db"
"shared.db._mongo".msg = "use shared.db"
"shared.db.models".msg = "legacy, use shared.db and shared.domain"
"shared.db.interface".msg = "legacy, use shared.db"
"shared.db.engine".msg = "legacy, use shared.db"

[tool.ruff.lint.per-file-ignores]
# the Mongo backend, its tests and the migration scripts
"shared/db/_mongo/**" = ["TID251"]
"shared/tests/db/**" = ["TID251"]
"shared/_migrations/**" = ["TID251"]
"airflow_src/plugins/_db_migrations/**" = ["TID251"]
"airflow_src/plugins/celery_config.py" = ["TID251"]
# the API modules are the only importers of the backend; this also covers the legacy
# interface.py, models.py and engine.py until they are gone
"shared/db/*.py" = ["TID251"]
# legacy, cf. design_docs/DB_INTERFACE_PLAN.md: remove an entry once the module is ported
"shared/path_layout.py" = ["TID251"]
"shared/display_paths.py" = ["TID251"]
"shared/settings_scope_resolver.py" = ["TID251"]
"shared/tests/test_path_layout.py" = ["TID251"]
"shared/tests/test_display_paths.py" = ["TID251"]
"shared/tests/test_runners.py" = ["TID251"]
"webapp/service/db.py" = ["TID251"]
"webapp/service/data_handling.py" = ["TID251"]
"webapp/service/owner.py" = ["TID251"]
"webapp/pages_/**" = ["TID251"]
"webapp/tests/pages_/test_admin_page.py" = ["TID251"]
"webapp/tests/pages_/impl/test_admin_utils.py" = ["TID251"]
"rest_api/main.py" = ["TID251"]
"rest_api/service.py" = ["TID251"]
"rest_api/tests/test_service.py" = ["TID251"]
"airflow_src/**" = ["TID251"]
"*.ipynb" = [
    "T201" # use of 'print' detected
]
"**/tests/**/test_*.py" = [
    "SLF001", # Private member accessed
    "PLR2004" # magic number used
]

[tool.pytest.ini_options]
pythonpath = [
# cf. README.md:A note on importing
    "./airflow_src/dags",
    "./airflow_src/plugins",
    "./shared",
    # this is to enable importing in tests as `from dags.impl. ...` rather than `from impl. ...`
    "./airflow_src",
    # note that package names must be unique in the airflow_src and webapp directories to not confuse the imports in pytest
    "./webapp"
]

[tool.coverage.run]
omit = [
    "**/test_*.py",
    ]

[tool.ty.rules]
unresolved-import = "ignore"  #         # TODO: remove after https://github.com/astral-sh/ty/issues/265

[tool.ty.src]
exclude = ["**/*ipynb"]
